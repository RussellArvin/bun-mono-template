name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # typecheck + oxlint + knip + Prettier — same as the pre-commit hook
      - run: bun run check
      # committed migrations must match the Drizzle schema
      - run: bun run drizzle:check
      # Disabled for now — re-enable to run unit tests in CI.
      # - run: bun test
