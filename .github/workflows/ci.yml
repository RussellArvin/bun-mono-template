name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Version comes from `packageManager` in package.json
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # typecheck, oxlint, knip, sherif, docs and env checks, Prettier —
      # same as the pre-commit hook
      - run: bun run check
      # committed migrations must match the Drizzle schema
      - run: bun run drizzle:check
      # Disabled for now — re-enable to run unit tests in CI.
      # - run: bun test

  # Lints the workflow files themselves
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
